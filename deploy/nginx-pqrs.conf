# /etc/nginx/sites-available/pqrs  (alternativa si usas nginx en vez de Apache)
# ln -s /etc/nginx/sites-available/pqrs /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name pqrs.tudominio.com *.pqrs.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pqrs.tudominio.com *.pqrs.tudominio.com;
    root /var/www/html/app-pqrs/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/pqrs.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pqrs.tudominio.com/privkey.pem;

    client_max_body_size 12m;
    charset utf-8;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# /etc/apache2/sites-available/pqrs.conf
# a2enmod rewrite headers ssl proxy_fcgi setenvif && a2enconf php8.4-fpm
# a2ensite pqrs && systemctl reload apache2
# Cambia pqrs.tudominio.com por tu dominio.

<VirtualHost *:80>
    ServerName pqrs.tudominio.com
    ServerAlias *.pqrs.tudominio.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName pqrs.tudominio.com
    ServerAlias *.pqrs.tudominio.com

    # IMPORTANTE: apuntar a /public, nunca a la raíz del proyecto (expondría el .env)
    DocumentRoot /var/www/html/app-pqrs/public
    # Bloquear todo lo que esté fuera de /public por si acaso
    <Directory /var/www/html/app-pqrs>
        Require all denied
    </Directory>
    <Directory /var/www/html/app-pqrs/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Adjuntos: 10 MB por envío + margen
    LimitRequestBody 12582912

    SSLEngine on
    # Certificado COMODÍN (*.pqrs.tudominio.com + pqrs.tudominio.com)
    SSLCertificateFile    /etc/letsencrypt/live/pqrs.tudominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pqrs.tudominio.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/pqrs-error.log
    CustomLog ${APACHE_LOG_DIR}/pqrs-access.log combined
</VirtualHost>

; /etc/php/8.4/fpm/conf.d/99-pqrs.ini  →  systemctl restart php8.4-fpm
upload_max_filesize = 6M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; tras cada despliegue: systemctl reload php8.4-fpm
date.timezone = America/Bogota
